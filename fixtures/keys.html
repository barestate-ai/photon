<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Keys fixture</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    #box { position: absolute; left: 20px; top: 20px; width: 300px; height: 30px; }
  </style>
</head>
<body>
  <input id="box" aria-label="Box" autofocus>
  <script>
    // A shortcut that reaches the page shows up as a beacon in the fixture log.
    window.nonce = Math.random();
    for (const type of ["keydown", "keyup", "keypress", "input"]) {
      addEventListener(type, (event) => {
        new Image().src = `/__beacon?ev=${type}&key=${encodeURIComponent(event.key || "")}`;
      }, true);
    }
    // Input sent before the page has painted its first frame can be dropped.
    addEventListener("load", () => {
      requestAnimationFrame(() => { new Image().src = "/__beacon?ready=1"; });
    });
  </script>
</body>
</html>
