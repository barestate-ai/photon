<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input fixture</title></head>
<body>
  <h1>Input fixture</h1>
  <input id="box" aria-label="Box" autofocus>
  <script>
    // Each event is reported with the page's own clock so a harness can order it against the app.
    for (const type of ["mousedown", "click", "keydown"]) {
      addEventListener(type, () => {
        new Image().src = `/__beacon?ev=${type}&t=${Date.now()}`;
      }, true);
    }
    // Input sent before the page has painted its first frame can be dropped.
    addEventListener("load", () => {
      requestAnimationFrame(() => { new Image().src = "/__beacon?ready=1"; });
    });
  </script>
</body>
</html>
